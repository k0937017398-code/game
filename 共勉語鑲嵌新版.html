<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>共勉語鑲嵌</title>
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 確保拖曳時不觸發網頁滾動與選取文字 */
    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    
    /* 自訂動畫效果 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center py-4 px-3 font-sans overflow-y-auto">

  <div class="max-w-xl w-full text-center mb-2 flex flex-col justify-end">
    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 mb-1">共勉語鑲嵌</h1>
    <p class="text-slate-700 text-xs md:text-sm mb-1 font-medium px-1">
      拖曳右側板塊至左側棋盤，點擊板塊可旋轉。<br/>
      使其相連邊的顏色與詞彙完全對應即可過關！
    </p>
    
    <!-- 提示與提交按鈕區塊 -->
    <div id="hint-container" class="h-12 flex items-center justify-center"></div>
  </div>

  <div class="w-full max-w-[900px] bg-slate-100 rounded-2xl shadow-xl p-3 border border-slate-300 flex flex-col items-center relative">
    
    <!-- ViewBox 750x310 緊湊精緻高度，消除下方多餘空白區域 -->
    <svg id="game-svg" viewBox="0 0 750 310" class="w-full h-auto" style="touch-action: none;">
      <defs>
        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2" />
        </filter>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- 棋盤空槽位將由 JS 產生 -->
      <g id="board-slots"></g>

      <!-- 右側托盤區裝飾背景 -->
      <rect id="tray-bg" x="350" y="15" width="385" height="280" rx="15" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" style="transition: opacity 0.5s;" />

      <!-- 拼圖板塊將由 JS 產生 -->
      <g id="pieces-layer"></g>
    </svg>

    <!-- 過關慶祝疊加畫面 (預設隱藏) -->
    <div id="win-overlay" class="hidden absolute inset-0 z-10 m-3 bg-white/95 backdrop-blur-md rounded-2xl shadow-sm border border-slate-200 p-6 flex-col items-center justify-center fade-in">
      <h2 id="win-title" class="text-3xl font-extrabold text-amber-500 mb-2 drop-shadow-sm text-center"></h2>
      
      <!-- 展示完整共勉語金句卡 -->
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 my-3 text-center max-w-md shadow-inner">
        <p class="text-amber-900 font-extrabold text-xl md:text-2xl tracking-wide mb-1">
          「慈悲沒有敵人，智慧不起煩惱」
        </p>
        <p class="text-amber-700 text-xs md:text-sm font-medium">心寬念純 · 圓融智慧</p>
      </div>

      <p id="win-subtitle" class="text-slate-700 mb-6 text-base font-bold text-center"></p>
      <button onclick="startNewGame()" class="px-8 py-3 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-white font-bold rounded-full shadow-lg transition-transform active:scale-95">
        下一位挑戰者
      </button>
    </div>

  </div>

  <script>
    // === 簡易Web Audio API音效處理 ===
    function playSnapSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch(e){}
    }

    function playWinSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 0.4);
        });
      } catch(e){}
    }

    // === 遊戲設定與常數 ===
    const COLORS = ["#EF4444", "#3B82F6", "#10B981", "#F59E0B", "#8B5CF6", "#EC4899"];
    const COLOR_WORDS_MAP = {
      "#EF4444": "慈悲",
      "#3B82F6": "沒有",
      "#10B981": "敵人",
      "#F59E0B": "智慧",
      "#8B5CF6": "不起",
      "#EC4899": "煩惱"
    };

    const R = 48; 
    const HEX_HEIGHT = Math.sqrt(3) * R;
    const D = HEX_HEIGHT; 
    
    // 左側棋盤中心點 (垂直高度調升至 155)
    const BOARD_CX = 180;
    const BOARD_CY = 155;

    const SLOT_CENTERS = [
      // 0~6: 左側棋盤 (Board)
      { x: BOARD_CX, y: BOARD_CY }, // 0: Center
      { x: BOARD_CX + D, y: BOARD_CY }, // 1: Right
      { x: BOARD_CX + D * Math.cos(Math.PI / 3), y: BOARD_CY + D * Math.sin(Math.PI / 3) }, // 2: Bottom-Right
      { x: BOARD_CX - D * Math.cos(Math.PI / 3), y: BOARD_CY + D * Math.sin(Math.PI / 3) }, // 3: Bottom-Left
      { x: BOARD_CX - D, y: BOARD_CY }, // 4: Left
      { x: BOARD_CX - D * Math.cos(Math.PI / 3), y: BOARD_CY - D * Math.sin(Math.PI / 3) }, // 5: Top-Left
      { x: BOARD_CX + D * Math.cos(Math.PI / 3), y: BOARD_CY - D * Math.sin(Math.PI / 3) }, // 6: Top-Right
      
      // 7~13: 右側待放區 (Tray) - 上排 3 塊 (Y=95)、下排 4 塊 (Y=215)
      { x: 458, y: 95 }, { x: 550, y: 95 }, { x: 642, y: 95 },                  // 上排 3 片
      { x: 412, y: 215 }, { x: 504, y: 215 }, { x: 596, y: 215 }, { x: 688, y: 215 } // 下排 4 片
    ];

    const CONSTRAINTS = [
      [],
      [{ n: 0, me: 3, ne: 0 }],
      [{ n: 0, me: 4, ne: 1 }, { n: 1, me: 5, ne: 2 }],
      [{ n: 0, me: 5, ne: 2 }, { n: 2, me: 0, ne: 3 }],
      [{ n: 0, me: 0, ne: 3 }, { n: 3, me: 1, ne: 4 }],
      [{ n: 0, me: 1, ne: 4 }, { n: 4, me: 2, ne: 5 }],
      [{ n: 0, me: 2, ne: 5 }, { n: 5, me: 3, ne: 0 }, { n: 1, me: 1, ne: 4 }]
    ];

    const svgNS = "http://www.w3.org/2000/svg";

    // === 遊戲狀態變數 ===
    let pieces = [];
    let isWon = false;
    let canSubmit = false;
    let isAutoSolved = false;
    let hintLevel = 0;
    let draggingId = null;
    let dragPos = { x: 0, y: 0 };
    let dragStartPos = { x: 0, y: 0 };
    let timers = [];

    // === 輔助函式 ===
    function getPermutations(arr) {
      if (arr.length <= 1) return [arr];
      const result = [];
      for (let i = 0; i < arr.length; i++) {
        const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
        for (let p of getPermutations(rest)) {
          result.push([arr[i], ...p]);
        }
      }
      return result;
    }

    function shuffleArray(array) {
      let curId = array.length;
      while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = array[curId];
        array[curId] = array[randId];
        array[randId] = tmp;
      }
      return array;
    }

    function generateValidBoard() {
      const allPerms = getPermutations([0, 1, 2, 3, 4, 5]);
      shuffleArray(allPerms);

      let board = new Array(7).fill(null);
      let usedPerms = new Set();

      function solve(index) {
        if (index === 7) return true;
        for (let perm of allPerms) {
          let permStr = perm.join('');
          if (usedPerms.has(permStr)) continue;

          let valid = true;
          for (let c of CONSTRAINTS[index]) {
            if (perm[c.me] !== board[c.n][c.ne]) {
              valid = false;
              break;
            }
          }

          if (valid) {
            board[index] = perm;
            usedPerms.add(permStr);
            if (solve(index + 1)) return true;
            usedPerms.delete(permStr);
          }
        }
        return false;
      }

      solve(0);
      return board;
    }

    function getColorAtEdge(piece, edgeIndex) {
      const logicRot = ((piece.rotation % 6) + 6) % 6;
      return piece.colors[(edgeIndex - logicRot + 6) % 6];
    }

    function createSVG(tag, attrs) {
      const el = document.createElementNS(svgNS, tag);
      for (let k in attrs) {
        el.setAttribute(k, attrs[k]);
      }
      return el;
    }

    // === 初始化靜態 UI ===
    function initStaticUI() {
      const boardSlots = document.getElementById('board-slots');
      SLOT_CENTERS.slice(0, 7).forEach(center => {
        let points = [0, 1, 2, 3, 4, 5].map(i => {
          const a = (i * 60 - 30) * (Math.PI / 180);
          return `${center.x + R * Math.cos(a)},${center.y + R * Math.sin(a)}`;
        }).join(' ');
        
        boardSlots.appendChild(createSVG('polygon', {
          points: points,
          fill: 'white',
          stroke: '#cbd5e1',
          'stroke-width': '2',
          'stroke-dasharray': '5 5'
        }));
      });
    }

    // === 遊戲核心邏輯 ===
    window.startNewGame = function() {
      isWon = false;
      canSubmit = false;
      isAutoSolved = false;
      hintLevel = 0;
      
      timers.forEach(clearTimeout);
      timers = [];

      document.getElementById('win-overlay').classList.add('hidden');
      document.getElementById('win-overlay').classList.remove('flex');
      document.getElementById('tray-bg').style.opacity = '1';
      updateHintUI();

      const validBoard = generateValidBoard();
      
      const initialPieces = validBoard.map((perm, idx) => ({
        id: `piece-${idx}`,
        originalIdx: idx,
        colors: perm.map(colorIdx => COLORS[colorIdx]),
        rotation: Math.floor(Math.random() * 6),
        slot: 7 + idx
      }));
      
      pieces = shuffleArray(initialPieces);
      
      buildPiecesDOM();
      updatePiecesTransform();
      startTimers();
    };

    function startTimers() {
      timers.push(setTimeout(() => setHint(1), 120000)); // 2 分鐘
      timers.push(setTimeout(() => setHint(2), 240000)); // 4 分鐘
      timers.push(setTimeout(() => setHint(3), 360000)); // 6 分鐘
      timers.push(setTimeout(() => triggerAutoSolve(), 500000)); // 500 秒
    }

    function setHint(level) {
      if (isWon || canSubmit) return;
      hintLevel = Math.max(hintLevel, level);
      updateHintUI();
      updatePiecesTransform();
    }

    function triggerAutoSolve() {
      if (isWon) return;
      hintLevel = 4;
      canSubmit = true;
      isAutoSolved = true;
      
      pieces.forEach(p => {
        const correctSlot = p.originalIdx;
        const rem = ((p.rotation % 6) + 6) % 6;
        const diff = (6 - rem) % 6;
        p.slot = correctSlot;
        p.rotation += diff;
      });
      
      updatePiecesTransform();
      updateHintUI();
    }

    function checkWin() {
      if (pieces.length === 0 || draggingId !== null || isWon) return;
      
      const allOnBoard = pieces.every(p => p.slot >= 0 && p.slot <= 6);
      if (!allOnBoard) {
        canSubmit = false;
        updateHintUI();
        return;
      }

      const getPieceInSlot = (slotIdx) => pieces.find(p => p.slot === slotIdx);

      let win = true;
      for (let i = 1; i <= 6; i++) {
        const p1 = getPieceInSlot(i);
        if (!p1) { win = false; break; }
        
        for (let c of CONSTRAINTS[i]) {
          const p2 = getPieceInSlot(c.n);
          if (!p2 || getColorAtEdge(p1, c.me) !== getColorAtEdge(p2, c.ne)) {
            win = false;
            break;
          }
        }
        if (!win) break;
      }

      canSubmit = win;
      updateHintUI();
    }

    // 玩家點擊「提交答案」按鈕時調用
    window.submitAnswer = function() {
      if (!canSubmit) return;
      isWon = true;
      timers.forEach(clearTimeout);
      playWinSound();
      updatePiecesTransform();
      document.getElementById('tray-bg').style.opacity = '0.3';
      showWinScreen(isAutoSolved);
    };

    function showWinScreen(isAutoSolve) {
      const overlay = document.getElementById('win-overlay');
      const title = document.getElementById('win-title');
      const subtitle = document.getElementById('win-subtitle');
      
      title.innerText = isAutoSolve ? "時間到，解答展示！" : "闖關成功！";
      subtitle.innerText = isAutoSolve ? "已為您展示正確解答 💡" : "智慧圓融，恭喜過關 🎉";
      
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    // === DOM 渲染與更新 ===
    function updateHintUI() {
      const container = document.getElementById('hint-container');
      container.innerHTML = '';

      if (isWon) return;

      // 當對應正確時，浮現提交答案按鈕
      if (canSubmit) {
        container.innerHTML = `
          <button onclick="submitAnswer()" class="px-7 py-2 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-extrabold rounded-full shadow-lg border-2 border-emerald-200 transition-all animate-bounce flex items-center gap-2 cursor-pointer text-sm sm:text-base">
            ✨ 提交答案
          </button>
        `;
        return;
      }

      let html = '';
      if (hintLevel === 1) {
        html = `<div class="text-amber-600 font-bold bg-amber-50 px-3 py-1.5 rounded-full border border-amber-200 animate-pulse text-xs sm:text-sm">💡 提示一：將「★」標記放在最中央</div>`;
      } else if (hintLevel === 2) {
        html = `<div class="text-blue-600 font-bold bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200 animate-pulse text-xs sm:text-sm">💡 提示二：「★」放中央，「②」放在正右方</div>`;
      } else if (hintLevel === 3) {
        html = `<div class="text-emerald-600 font-bold bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200 animate-pulse text-xs sm:text-sm">💡 提示三：「②」放右方，「③」放在★右下方</div>`;
      } else if (hintLevel === 4) {
        html = `<div class="text-green-600 font-bold bg-green-50 px-3 py-1.5 rounded-full border border-green-200 text-xs sm:text-sm">⏳ 時間到！點擊提交答案查看解答</div>`;
      }
      container.innerHTML = html;
    }

    // 建立 SVG DOM 節點
    function buildPiecesDOM() {
      const layer = document.getElementById('pieces-layer');
      layer.innerHTML = '';

      pieces.forEach(piece => {
        const g = createSVG('g', {
          'data-id': piece.id,
          'class': 'cursor-grab',
          'style': 'transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);'
        });

        // 邊框
        let points = [0, 1, 2, 3, 4, 5].map(i => {
          const a = (i * 60 - 30) * (Math.PI / 180);
          return `${R * Math.cos(a)},${R * Math.sin(a)}`;
        }).join(' ');
        
        const polygon = createSVG('polygon', {
          points: points,
          fill: 'white',
          stroke: '#94a3b8',
          'stroke-width': '2',
          'class': 'piece-border'
        });
        g.appendChild(polygon);

        // 6個三角形與文字
        [0, 1, 2, 3, 4, 5].forEach(i => {
          const a1 = (i * 60 - 30) * (Math.PI / 180);
          const a2 = ((i + 1) * 60 - 30) * (Math.PI / 180);
          const x1 = R * Math.cos(a1);
          const y1 = R * Math.sin(a1);
          const x2 = R * Math.cos(a2);
          const y2 = R * Math.sin(a2);
          
          const triangleColor = piece.colors[i];
          const word = COLOR_WORDS_MAP[triangleColor];

          const triGroup = createSVG('g', {});
          
          const path = createSVG('path', {
            d: `M 0 0 L ${x1} ${y1} L ${x2} ${y2} Z`,
            fill: triangleColor,
            stroke: 'rgba(0,0,0,0.15)',
            'stroke-width': '1',
            style: 'pointer-events: none;'
          });
          
          const text = createSVG('text', {
            transform: `rotate(${i * 60}) translate(27, 0)`,
            fill: 'white',
            'font-size': '14',
            'font-weight': 'bold',
            'text-anchor': 'middle',
            'dominant-baseline': 'central',
            'paint-order': 'stroke',
            stroke: 'rgba(0,0,0,0.5)',
            'stroke-width': '2.5',
            style: 'pointer-events: none;'
          });
          text.textContent = word;

          triGroup.appendChild(path);
          triGroup.appendChild(text);
          g.appendChild(triGroup);
        });

        // 預留提示標記群組
        const hintGroup = createSVG('g', { 'class': 'hint-group pointer-events-none drop-shadow-md', 'display': 'none' });
        const hintCircle = createSVG('circle', { cx: '0', cy: '0', r: '14', fill: 'white', 'stroke-width': '2' });
        const hintText = createSVG('text', { x: '0', y: '5', 'text-anchor': 'middle', 'font-weight': 'bold' });
        
        hintGroup.appendChild(hintCircle);
        hintGroup.appendChild(hintText);
        g.appendChild(hintGroup);

        layer.appendChild(g);
      });
    }

    // 更新座標、旋轉與狀態樣式
    function updatePiecesTransform() {
      pieces.forEach(piece => {
        const isDragging = piece.id === draggingId;
        const targetPos = isDragging ? dragPos : SLOT_CENTERS[piece.slot];
        
        const g = document.querySelector(`g[data-id="${piece.id}"]`);
        if (!g) return;

        g.setAttribute('transform', `translate(${targetPos.x}, ${targetPos.y}) rotate(${piece.rotation * 60})`);
        
        g.style.transition = isDragging ? 'none' : 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
        g.style.cursor = isDragging || hintLevel === 4 || isWon ? 'default' : 'grab';
        
        if (isDragging) {
          g.parentNode.appendChild(g);
        }

        let filter = "none";
        let stroke = "#94a3b8";
        let strokeW = "2";

        if (isWon) {
          filter = "url(#glow)";
          stroke = "#F59E0B";
        } else if (isDragging) {
          filter = "url(#drop-shadow)";
          stroke = "#3B82F6";
          strokeW = "3";
        }
        
        g.setAttribute('filter', filter);
        const polygon = g.querySelector('.piece-border');
        polygon.setAttribute('stroke', stroke);
        polygon.setAttribute('stroke-width', strokeW);

        const hintGroup = g.querySelector('.hint-group');
        const hintCircle = hintGroup.querySelector('circle');
        const hintText = hintGroup.querySelector('text');
        
        let showHint = false;
        if (hintLevel >= 1 && piece.originalIdx === 0) {
          showHint = true;
          hintCircle.setAttribute('stroke', '#F59E0B');
          hintText.setAttribute('fill', '#F59E0B');
          hintText.setAttribute('font-size', '16');
          hintText.textContent = '★';
        } else if (hintLevel >= 2 && piece.originalIdx === 1) {
          showHint = true;
          hintCircle.setAttribute('stroke', '#3B82F6');
          hintText.setAttribute('fill', '#3B82F6');
          hintText.setAttribute('font-size', '14');
          hintText.textContent = '2';
        } else if (hintLevel >= 3 && piece.originalIdx === 2) {
          showHint = true;
          hintCircle.setAttribute('stroke', '#10B981');
          hintText.setAttribute('fill', '#10B981');
          hintText.setAttribute('font-size', '14');
          hintText.textContent = '3';
        }

        if (showHint && hintLevel !== 4 && !isWon) {
          hintGroup.setAttribute('display', 'block');
          hintGroup.setAttribute('transform', `rotate(${-piece.rotation * 60})`);
        } else {
          hintGroup.setAttribute('display', 'none');
        }
      });
    }

    // === 滑鼠與觸控互動 ===
    const svgEl = document.getElementById('game-svg');

    function getMousePosition(evt) {
      const CTM = svgEl.getScreenCTM();
      if (!CTM) return { x: 0, y: 0 };
      const clientX = evt.clientX ?? evt.touches?.[0]?.clientX;
      const clientY = evt.clientY ?? evt.touches?.[0]?.clientY;
      return {
        x: (clientX - CTM.e) / CTM.a,
        y: (clientY - CTM.f) / CTM.d
      };
    }

    svgEl.addEventListener('pointerdown', (e) => {
      if (hintLevel === 4 || isWon) return;
      const pieceGroup = e.target.closest('g[data-id]');
      if (!pieceGroup) return;

      const pieceId = pieceGroup.getAttribute('data-id');
      const piece = pieces.find(p => p.id === pieceId);
      if (!piece) return;

      svgEl.setPointerCapture(e.pointerId);
      const pos = getMousePosition(e);
      draggingId = piece.id;
      dragPos = pos;
      dragStartPos = pos;
      
      updatePiecesTransform();
    });

    svgEl.addEventListener('pointermove', (e) => {
      if (!draggingId) return;
      dragPos = getMousePosition(e);
      updatePiecesTransform();
    });

    function handlePointerEnd(e) {
      if (!draggingId) return;
      
      const pos = getMousePosition(e);
      const dx = pos.x - dragStartPos.x;
      const dy = pos.y - dragStartPos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      const pieceIndex = pieces.findIndex(p => p.id === draggingId);
      
      if (dist < 5) {
        // 點擊旋轉板塊
        pieces[pieceIndex].rotation += 1;
        playSnapSound();
      } else {
        // 拖曳吸附
        let closestSlot = -1;
        let minDist = Infinity;
        SLOT_CENTERS.forEach((center, idx) => {
          const d = Math.sqrt(Math.pow(pos.x - center.x, 2) + Math.pow(pos.y - center.y, 2));
          if (d < minDist) {
            minDist = d;
            closestSlot = idx;
          }
        });

        if (minDist < 48) {
          const occupyingIndex = pieces.findIndex(p => p.slot === closestSlot);
          const draggedPiece = pieces[pieceIndex];
          
          if (occupyingIndex !== -1 && occupyingIndex !== pieceIndex) {
            pieces[occupyingIndex].slot = draggedPiece.slot;
          }
          pieces[pieceIndex].slot = closestSlot;
          playSnapSound();
        }
      }
      
      draggingId = null;
      if (e.pointerId) {
        try { svgEl.releasePointerCapture(e.pointerId); } catch(err){}
      }
      
      updatePiecesTransform();
      checkWin();
    }

    svgEl.addEventListener('pointerup', handlePointerEnd);
    svgEl.addEventListener('pointercancel', handlePointerEnd);

    // 支援滾輪旋轉板塊
    svgEl.addEventListener('wheel', (e) => {
      if (isWon) return;
      const pieceGroup = e.target.closest('g[data-id]');
      if (!pieceGroup) return;

      const pieceId = pieceGroup.getAttribute('data-id');
      const piece = pieces.find(p => p.id === pieceId);
      if (piece) {
        e.preventDefault();
        piece.rotation += e.deltaY > 0 ? 1 : -1;
        playSnapSound();
        updatePiecesTransform();
        checkWin();
      }
    }, { passive: false });

    // 啟動遊戲
    window.addEventListener('DOMContentLoaded', () => {
      initStaticUI();
      startNewGame();
    });

  </script>
</body>
