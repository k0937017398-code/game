<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新春福慧翻翻樂</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Lock screen to prevent scrolling/zooming on tablets */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            /* Festive Red/Crimson Gradient */
            background: linear-gradient(135deg, #991b1b 0%, #dc2626 50%, #7f1d1d 100%);
            font-family: 'Inter', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        /* Floating particles canvas */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 3D Card Flip Container */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 100%;
            touch-action: manipulation;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        /* Face down state (rotated 180 deg) */
        .card-container.face-down .card-inner {
            transform: rotateY(180deg);
        }

        /* Front and Back of the card */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px -2px rgba(127, 29, 29, 0.5), 0 2px 4px -2px rgba(127, 29, 29, 0.3);
        }

        /* Front (Text face - Bright and clean) */
        .card-front {
            background-color: #fffbeb; /* amber-50 */
            border: 2px solid #fde68a; /* amber-200 */
            transform: rotateY(0deg);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        /* Back (Festive Fu character) */
        .card-back {
            background: linear-gradient(145deg, #ef4444, #b91c1c); /* red-500 to red-700 */
            border: 2px solid #fbbf24; /* amber-400 gold border */
            color: #fef08a; /* yellow-200 text */
            transform: rotateY(180deg);
            box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        /* Glow Animation for sequence highlighting (Golden Glow) */
        .glow {
            box-shadow: 0 0 24px 8px rgba(251, 191, 36, 0.9), inset 0 0 10px rgba(245, 158, 11, 0.5) !important;
            background-color: #fef3c7 !important;
            border-color: #f59e0b !important;
            transform: scale(1.04);
            z-index: 15;
            transition: all 0.25s ease;
        }

        /* Error shake and red color */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        .card-error {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        /* Correct state (Turns Golden/Yellow) */
        .card-correct {
            background-color: #fef08a !important; /* yellow-200 */
            border-color: #eab308 !important; /* yellow-500 */
            color: #713f12 !important; /* yellow-900 */
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Modal Fade In */
        .modal-fade-in {
            animation: modalFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center relative text-red-950">

    <!-- Background Particle Canvas (Gold particles) -->
    <canvas id="bg-canvas"></canvas>

    <!-- 1. Lobby Screen -->
    <div id="lobby-screen" class="flex flex-col items-center justify-center w-full h-full p-4 sm:p-6 absolute inset-0 z-20">
        <div class="bg-red-50/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-8 max-w-md w-full flex flex-col items-center text-center border-4 border-amber-400">
            
            <!-- Logo (Red Envelope / Firecracker vibe) -->
            <div class="w-20 h-20 bg-gradient-to-tr from-red-500 to-red-600 rounded-full flex items-center justify-center mb-3 shadow-inner border-2 border-amber-300">
                <span class="text-4xl filter drop-shadow">🧧</span>
            </div>

            <h1 class="text-2xl sm:text-3xl font-extrabold text-red-700 tracking-wide mb-4 drop-shadow-sm">新春福慧翻翻樂</h1>
            
            <!-- Name Input -->
            <div class="w-full mb-4 text-left">
                <label for="player-name" class="block text-xs sm:text-sm font-bold text-red-800 mb-1 pl-1">
                    <i class="fa-solid fa-user-pen mr-1 text-red-600"></i> 挑戰者姓名：
                </label>
                <input type="text" id="player-name" placeholder="請輸入你的名字" 
                       class="w-full px-4 py-3 rounded-xl border-2 border-red-200 focus:outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-100 text-base sm:text-lg transition text-center shadow-inner font-semibold text-red-900" 
                       autocomplete="off">
            </div>

            <!-- Game Rules (Vertical List) -->
            <div class="w-full bg-white/80 rounded-2xl p-4 mb-5 text-left border border-amber-200 shadow-inner">
                <h2 class="font-bold text-red-700 mb-3 flex items-center text-sm">
                    <i class="fa-solid fa-scroll mr-2 text-amber-500"></i> 挑戰規則
                </h2>
                <ul class="text-red-900 text-xs sm:text-sm leading-relaxed font-medium flex flex-col space-y-2">
                    <li class="flex items-start">
                        <span class="text-amber-500 font-bold mr-2 mt-0.5">1.</span> 
                        <span>你有 <strong class="text-red-600 mx-1">5 顆心</strong> 生命值，每關字數逐級增加。</span>
                    </li>
                    <li class="flex items-start">
                        <span class="text-amber-500 font-bold mr-2 mt-0.5">2.</span> 
                        <span>仔細觀察並記住金光閃爍的數學名詞順序。</span>
                    </li>
                    <li class="flex items-start">
                        <span class="text-amber-500 font-bold mr-2 mt-0.5">3.</span> 
                        <span>「福」字牌面翻轉後，憑記憶依照原順序點擊。</span>
                    </li>
                    <li class="flex items-start">
                        <span class="text-amber-500 font-bold mr-2 mt-0.5">4.</span> 
                        <span>若點錯會扣愛心；若 5 顆心皆失，<strong class="text-red-600 ml-1">將回第 1 關重新挑戰。</strong></span>
                    </li>
                </ul>
            </div>

            <!-- Start Button -->
            <button onclick="startGame()" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-bold py-3.5 rounded-xl shadow-[0_4px_15px_rgba(220,38,38,0.5)] border border-red-400 transition transform active:scale-95 text-lg flex items-center justify-center space-x-2">
                <span>敲鑼打鼓開始囉</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </div>
    </div>

    <!-- 2. Game Screen -->
    <div id="game-screen" class="hidden absolute inset-0 z-10 flex flex-row w-full h-full p-4 sm:p-6 gap-4 sm:gap-8 bg-black/10">
        
        <!-- Left Panel: UI / Info (Fixed Width) -->
        <div class="w-64 sm:w-72 lg:w-80 flex-shrink-0 h-full bg-red-950/90 backdrop-blur-md rounded-[2rem] p-5 lg:p-6 shadow-2xl border-4 border-amber-400 flex flex-col items-center justify-between relative overflow-hidden">
            <!-- decorative circles -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/20 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-red-500/30 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="w-full flex flex-col items-center gap-4 lg:gap-6 z-10 mt-2">
                <!-- Avatar & Name -->
                <div class="text-center w-full">
                    <div class="w-16 h-16 lg:w-20 lg:h-20 bg-gradient-to-br from-amber-200 to-yellow-500 rounded-full flex items-center justify-center border-4 border-white shadow-xl mx-auto mb-2">
                        <i class="fa-solid fa-user-graduate text-3xl lg:text-4xl text-red-800"></i>
                    </div>
                    <div class="text-amber-400/80 font-bold text-xs lg:text-sm tracking-widest mb-1">挑戰者</div>
                    <div id="display-name" class="text-xl lg:text-2xl font-black text-white truncate max-w-full drop-shadow-md px-2">挑戰者姓名</div>
                </div>

                <!-- Level Box -->
                <div class="w-full bg-red-900/50 rounded-2xl py-3 lg:py-4 border border-red-500/30 text-center shadow-inner">
                    <div class="text-red-300/80 font-bold text-xs tracking-widest mb-1">目前關卡</div>
                    <div id="level-display" class="text-3xl lg:text-4xl font-black text-amber-400 drop-shadow-lg">第 1 關</div>
                </div>
            </div>

            <!-- Hearts Box -->
            <div class="w-full flex flex-col items-center z-10 mb-auto mt-6 lg:mt-8">
                <div class="text-amber-400/80 font-bold text-xs lg:text-sm tracking-widest mb-2 lg:mb-3">剩餘生命</div>
                <div id="hearts-display" class="flex flex-wrap justify-center gap-1.5 lg:gap-2 px-1">
                    <!-- Hearts injected by JS -->
                </div>
            </div>

            <!-- Status Hint -->
            <div id="game-status-hint" class="w-full text-center text-sm lg:text-lg font-bold text-red-900 bg-amber-100 px-4 py-3 lg:py-4 rounded-2xl border-2 border-amber-400 shadow-xl z-10 transition-all duration-300">
                請準備...
            </div>
        </div>

        <!-- Right Panel: Grid Area (Flex Grow) -->
        <div class="flex-grow h-full flex justify-center items-center relative py-2">
            <!-- 5x5 CSS Grid Container -->
            <div id="grid-container" class="grid grid-cols-[auto_1fr_1fr_1fr_1fr] grid-rows-[auto_1fr_1fr_1fr_1fr] gap-2 sm:gap-3 lg:gap-4 w-full max-w-[90vh] max-h-full aspect-square">
                <!-- Dynamic Content injected here (Labels + Cards) -->
            </div>
        </div>
    </div>

    <!-- 3. Overlays (Modals) -->
    <div id="overlay-container" class="hidden absolute inset-0 bg-red-950/80 backdrop-blur-sm z-30 flex items-center justify-center p-4">
        
        <!-- Level Clear / Game Complete -->
        <div id="celebration-modal" class="hidden bg-red-50/95 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-[0_0_30px_rgba(245,158,11,0.3)] border-4 border-amber-400 transform">
            <div id="celebration-icon" class="text-5xl mb-3 animate-bounce">🎊</div>
            <h2 id="celebration-title" class="text-2xl font-black text-red-700 mb-2 leading-tight"></h2>
            <p id="celebration-subtitle" class="text-sm font-medium text-red-900 mb-4"></p>
            
            <!-- Remaining Hearts Stats -->
            <div class="bg-white rounded-2xl p-3 mb-5 border border-amber-200">
                <span class="block text-xs font-bold text-red-600 mb-1">結算生命值</span>
                <div id="remaining-lives-display" class="flex justify-center items-center text-xl text-red-500 space-x-1">
                    <!-- Injected via JS -->
                </div>
            </div>

            <button id="next-level-btn" onclick="nextLevel()" class="w-full bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-red-900 font-black py-3.5 rounded-xl shadow-lg border border-amber-300 transition transform active:scale-95 text-base sm:text-lg">
                進入下一關
            </button>
            <button id="home-btn" onclick="returnToLobby()" class="hidden w-full bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-red-900 font-black py-3.5 rounded-xl shadow-lg border border-amber-300 transition transform active:scale-95 text-base sm:text-lg">
                榮耀返鄉 (回大廳)
            </button>
        </div>

        <!-- Game Over -->
        <div id="game-over-modal" class="hidden bg-white/95 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-gray-300 transform">
            <div class="text-5xl mb-3 text-red-600"><i class="fa-solid fa-heart-crack"></i></div>
            <h2 class="text-2xl font-black text-gray-800 mb-2 leading-tight">挑戰失敗</h2>
            <p class="text-xs sm:text-sm text-gray-600 font-medium mb-3">
                5 顆生命值已耗盡。<br>「沒關係，新年新希望，再來一次！」
            </p>
            <div class="bg-gray-100 text-gray-600 text-xs font-bold py-2 px-3 rounded-xl mb-5 border border-gray-200">
                將返回第 1 關重新開始
            </div>
            <button onclick="restartGame()" class="w-full bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-95 text-base sm:text-lg flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rotate-left text-sm"></i>
                <span>重新出發</span>
            </button>
        </div>
    </div>

    <!-- Game Logic -->
    <script>
        // === 1. Levels & Decoys (Buddhist/New Year Theme) ===
        const levelsData = [
            "大家好",
            "新年快樂",
            "福慧滿人間",
            "時時心有法喜",
            "念念不離禪悅",
            "處處結善緣幸福滿人間",
            "時時心自在智慧無罣礙"
        ];

        const distractorsPool = [
            "慈", "悲", "春", "吉", "祥", "安", "康", "平", 
            "旺", "發", "財", "喜", "善", "緣", "佛", "光"
        ];

        const MAX_HEARTS = 5;

        // === 2. Game State ===
        let playerName = "挑戰者";
        let currentLevel = 0;
        let hearts = MAX_HEARTS;
        let currentStep = 0;
        let isAnimating = false;
        let gridData = [];

        // === 3. DOM Elements ===
        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const overlayContainer = document.getElementById('overlay-container');
        const celebrationModal = document.getElementById('celebration-modal');
        const gameOverModal = document.getElementById('game-over-modal');
        const gridContainer = document.getElementById('grid-container');
        const heartsDisplay = document.getElementById('hearts-display');
        const levelDisplay = document.getElementById('level-display');
        const displayName = document.getElementById('display-name');
        const gameStatusHint = document.getElementById('game-status-hint');
        const celebrationTitle = document.getElementById('celebration-title');
        const celebrationSubtitle = document.getElementById('celebration-subtitle');
        const celebrationIcon = document.getElementById('celebration-icon');
        const remainingLivesDisplay = document.getElementById('remaining-lives-display');
        const nextLevelBtn = document.getElementById('next-level-btn');
        const homeBtn = document.getElementById('home-btn');

        // === 4. Audio Synthesis (Web Audio API) ===
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Festive Chime for correct clicks
        function playDing(freq = 800, duration = 0.3) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // Dull thud/beep for error
        function playErrorSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {}
        }

        function playVictory() {
            // A festive ascending arpeggio
            [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((freq, idx) => {
                setTimeout(() => playDing(freq, 0.5), idx * 120);
            });
        }

        // === 5. Background Animated Particles (Gold Coins/Sparks) ===
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class GoldParticle {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                // Fall from top
                this.y = initial ? Math.random() * canvas.height : -20;
                this.size = Math.random() * 4 + 2;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 1;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.color = `rgba(252, 211, 77, ${this.opacity})`; // amber-300
            }
            update() {
                this.y += this.speedY; // Falling down
                this.x += this.speedX;
                // Wobble effect
                this.x += Math.sin(this.y * 0.05) * 0.5;
                
                if (this.y > canvas.height + 20) {
                    this.reset(false);
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                // Add a little glow
                ctx.shadowBlur = 5;
                ctx.shadowColor = "rgba(245, 158, 11, 0.8)";
            }
        }

        for (let i = 0; i < 40; i++) {
            particles.push(new GoldParticle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            ctx.shadowBlur = 0; // reset for next frame
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // === 6. Game Logic ===
        const delay = ms => new Promise(res => setTimeout(res, ms));

        function startGame() {
            initAudio();
            const inputVal = document.getElementById('player-name').value.trim();
            playerName = inputVal === "" ? "挑戰者" : inputVal;
            
            displayName.innerText = playerName;
            lobbyScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            currentLevel = 0;
            resetGameStats();
            loadLevel();
        }

        function resetGameStats() {
            hearts = MAX_HEARTS;
            updateHeartsDisplay();
        }

        function updateHeartsDisplay() {
            heartsDisplay.innerHTML = '';
            for (let i = 0; i < MAX_HEARTS; i++) {
                if (i < hearts) {
                    heartsDisplay.innerHTML += `<i class="fa-solid fa-heart text-red-500 text-2xl lg:text-3xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.4)] transition-transform duration-300"></i>`;
                } else {
                    heartsDisplay.innerHTML += `<i class="fa-solid fa-heart-crack text-red-900/30 text-2xl lg:text-3xl opacity-50"></i>`;
                }
            }
        }

        function loadLevel() {
            levelDisplay.innerText = `第 ${currentLevel + 1} 關`;
            gridContainer.innerHTML = '';
            gridData = [];
            currentStep = 0;

            const targetWord = levelsData[currentLevel];
            const targetChars = targetWord.split('');

            let charsToPlace = [];

            // Add target letters
            targetChars.forEach((char, index) => {
                charsToPlace.push({
                    char: char,
                    isTarget: true,
                    targetIndex: index
                });
            });

            // Add decoys
            let distractorsCopy = [...distractorsPool].sort(() => Math.random() - 0.5);
            while (charsToPlace.length < 16) {
                charsToPlace.push({
                    char: distractorsCopy[charsToPlace.length % distractorsCopy.length],
                    isTarget: false,
                    targetIndex: -1
                });
            }

            // Shuffle all 16 cells
            charsToPlace.sort(() => Math.random() - 0.5);

            // --- Constructing the 5x5 Grid (Coords + Cards) ---
            const createLabel = (text, type) => {
                const div = document.createElement('div');
                div.className = type === 'col' 
                    ? "flex justify-center items-end pb-1 sm:pb-2 font-black text-amber-300 text-3xl sm:text-4xl lg:text-5xl drop-shadow-md"
                    : "flex justify-end items-center pr-2 sm:pr-4 font-black text-amber-300 text-3xl sm:text-4xl lg:text-5xl drop-shadow-md";
                div.innerText = text;
                return div;
            };

            // Top Row (Empty cell + A, B, C, D)
            gridContainer.appendChild(createLabel('', 'col'));
            ['A', 'B', 'C', 'D'].forEach(lbl => gridContainer.appendChild(createLabel(lbl, 'col')));

            let charIndex = 0;
            // Next 4 Rows
            for(let r = 0; r < 4; r++) {
                // Left Column Label (1, 2, 3, 4)
                gridContainer.appendChild(createLabel((r + 1).toString(), 'row'));
                
                // 4 Cards per row
                for(let c = 0; c < 4; c++) {
                    const data = charsToPlace[charIndex++];
                    const cardOuter = document.createElement('div');
                    cardOuter.className = 'card-container cursor-pointer w-full h-full';

                    // Target: Red Bold, Decoy: Lighter Gold
                    const textStyle = data.isTarget
                        ? 'text-red-900 font-black text-5xl sm:text-6xl lg:text-7xl drop-shadow-sm'
                        : 'text-amber-600/70 font-bold text-5xl sm:text-6xl lg:text-7xl';

                    cardOuter.innerHTML = `
                        <div class="card-inner w-full h-full">
                            <div class="card-front ${textStyle} bg-[#fffbeb] border-2 border-[#fde68a]">
                                ${data.char}
                            </div>
                            <div class="card-back bg-gradient-to-br from-red-600 to-red-800 border-2 border-[#fbbf24]">
                                <!-- Golden Fu Text (UPRIGHT) -->
                                <div class="flex flex-col items-center justify-center w-full h-full border-[3px] border-amber-400/30 m-1 sm:m-2 rounded-xl">
                                    <span class="text-4xl sm:text-5xl lg:text-6xl text-amber-200 drop-shadow-md font-black">福</span>
                                </div>
                            </div>
                        </div>
                    `;

                    cardOuter.addEventListener('click', () => handleCardClick(cardOuter, data));
                    gridContainer.appendChild(cardOuter);
                    data.element = cardOuter;
                    gridData.push(data);
                }
            }

            // Start sequence after small delay
            setTimeout(playSequence, 450);
        }

        async function playSequence() {
            isAnimating = true;
            gameStatusHint.innerText = `【第 ${currentLevel + 1} 關】\n請凝神記住發亮順序...`;
            gameStatusHint.className = "w-full text-center text-sm lg:text-lg font-bold text-amber-900 bg-amber-200/90 px-4 py-3 lg:py-4 rounded-2xl border-2 border-amber-400 shadow-sm transition-all";

            // Ensure cards are face up
            let needsFlip = false;
            gridData.forEach(data => {
                if (data.element.classList.contains('face-down')) {
                    data.element.classList.remove('face-down');
                    needsFlip = true;
                }
                // Reset any previous correct styling if replaying
                const front = data.element.querySelector('.card-front');
                front.classList.remove('card-correct');
            });

            if (needsFlip) await delay(550);
            await delay(400);

            // Highlight target sequence in order
            const targetSequence = gridData.filter(d => d.isTarget).sort((a, b) => a.targetIndex - b.targetIndex);

            for (let i = 0; i < targetSequence.length; i++) {
                const frontFace = targetSequence[i].element.querySelector('.card-front');
                frontFace.classList.add('glow');
                
                playDing(600 + i * 50, 0.3);
                await delay(700);
                frontFace.classList.remove('glow');
                await delay(200);
            }

            await delay(350);

            // Flip all face down
            gameStatusHint.innerText = `翻牌完畢！\n請依序點出：\n${levelsData[currentLevel]}`;
            gameStatusHint.className = "w-full text-center text-sm lg:text-lg font-bold text-red-900 bg-amber-100/90 px-4 py-3 lg:py-4 rounded-2xl border-2 border-amber-400 shadow-sm transition-all";

            gridData.forEach(data => {
                data.element.classList.add('face-down');
            });

            await delay(600);
            isAnimating = false;
            currentStep = 0;
        }

        async function handleCardClick(cardElement, data) {
            // Ignore clicks if animating or already face up
            if (isAnimating || !cardElement.classList.contains('face-down')) return;

            cardElement.classList.remove('face-down');

            if (data.isTarget && data.targetIndex === currentStep) {
                // Correct Click
                const front = cardElement.querySelector('.card-front');
                front.classList.add('card-correct'); // Turn gold and stay open
                
                playDing(700 + currentStep * 60, 0.2);
                currentStep++;

                if (currentStep === levelsData[currentLevel].length) {
                    isAnimating = true;
                    await delay(500);
                    handleLevelClear();
                }
            } else {
                // Wrong Click
                isAnimating = true;
                playErrorSound();

                const inner = cardElement.querySelector('.card-inner');
                const front = cardElement.querySelector('.card-front');

                inner.classList.add('shake');
                front.classList.add('card-error');

                hearts--;
                updateHeartsDisplay();

                await delay(600);

                inner.classList.remove('shake');
                front.classList.remove('card-error');

                if (hearts <= 0) {
                    showGameOver();
                } else {
                    gameStatusHint.innerText = `點錯了！重新觀照順序...\n(剩餘 ${hearts} 心)`;
                    gameStatusHint.className = "w-full text-center text-sm lg:text-lg font-bold text-red-700 bg-red-100 px-4 py-3 lg:py-4 rounded-2xl border-2 border-red-300 shadow-sm transition-all";
                    await delay(800);
                    // Replay sequence
                    playSequence();
                }
            }
        }

        function handleLevelClear() {
            playVictory();
            overlayContainer.classList.remove('hidden');
            gameOverModal.classList.add('hidden');
            celebrationModal.classList.remove('hidden');
            celebrationModal.classList.add('modal-fade-in');

            // Render remaining hearts in modal
            remainingLivesDisplay.innerHTML = '';
            for (let i = 0; i < MAX_HEARTS; i++) {
                if (i < hearts) {
                    remainingLivesDisplay.innerHTML += `<i class="fa-solid fa-heart mx-0.5 drop-shadow-sm"></i>`;
                } else {
                    remainingLivesDisplay.innerHTML += `<i class="fa-solid fa-heart-crack text-red-900/20 mx-0.5 opacity-40"></i>`;
                }
            }
            remainingLivesDisplay.innerHTML += `<span class="ml-2 text-xs font-bold text-red-800">(${hearts} 顆心)</span>`;

            if (currentLevel === levelsData.length - 1) {
                // Game Complete
                celebrationIcon.innerHTML = '🧧';
                celebrationTitle.innerHTML = `恭喜發財！`;
                celebrationSubtitle.innerHTML = `恭賀 <span class="text-red-700 font-bold">${playerName}</span> 完全通關，福慧雙修！`;
                nextLevelBtn.classList.add('hidden');
                homeBtn.classList.remove('hidden');
            } else {
                // Level Clear
                celebrationIcon.innerHTML = '🧨';
                celebrationTitle.innerHTML = `新年快樂，${playerName}！`;
                celebrationSubtitle.innerHTML = `第 ${currentLevel + 1} 關順利突破！<br><strong class="text-red-800 text-lg tracking-wide mt-1 block">「${levelsData[currentLevel]}」</strong>`;
                nextLevelBtn.classList.remove('hidden');
                homeBtn.classList.add('hidden');
            }
        }

        function showGameOver() {
            overlayContainer.classList.remove('hidden');
            celebrationModal.classList.add('hidden');
            gameOverModal.classList.remove('hidden');
            gameOverModal.classList.add('modal-fade-in');
        }

        function nextLevel() {
            overlayContainer.classList.add('hidden');
            currentLevel++;
            loadLevel();
        }

        function restartGame() {
            overlayContainer.classList.add('hidden');
            currentLevel = 0;
            resetGameStats();
            loadLevel();
        }

        function returnToLobby() {
            overlayContainer.classList.add('hidden');
            gameScreen.classList.add('hidden');
            lobbyScreen.classList.remove('hidden');
        }
    </script>
</body>
